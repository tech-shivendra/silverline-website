<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="500" fill="#101216"/>
    <defs>
      <pattern id="pgrid-Synapse Graph Architecture" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171A20" stroke-width="1"/>
      </pattern>
      <linearGradient id="glow-Synapse Graph Architecture" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stopColor="#D4B3FF" stopOpacity="0.15"/>
        <stop offset="100%" stopColor="#101216" stopOpacity="0"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#pgrid-Synapse Graph Architecture)"/>
    <rect width="800" height="500" fill="url(#glow-Synapse Graph Architecture)"/>
    <rect x="20" y="20" width="760" height="460" rx="12" stroke="#282C33" stroke-width="1"/>
    
    <!-- Header bar -->
    <rect x="20" y="20" width="760" height="44" fill="#171A20" rx="12 12 0 0"/>
    <circle cx="48" cy="42" r="5" fill="#282C33"/>
    <circle cx="68" cy="42" r="5" fill="#282C33"/>
    <circle cx="88" cy="42" r="5" fill="#282C33"/>
    <text x="640" y="47" font-family="monospace" font-size="11" fill="#858B94">EXPERIMENTAL LAB</text>

    <!-- Content Mockup Graphics -->
    <rect x="50" y="90" width="700" height="140" rx="8" fill="#171A20" stroke="#282C33"/>
    <text x="80" y="140" font-family="sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">Synapse Graph Architecture</text>
    <text x="80" y="180" font-family="sans-serif" font-size="14" fill="#858B94">Internal Schema & Modules</text>

    <!-- Data lines & abstract telemetry -->
