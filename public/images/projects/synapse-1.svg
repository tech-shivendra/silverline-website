    <path d="M 80 340 C 200 300 350 400 500 330 C 650 260 700 320 720 290" stroke="#D4B3FF" stroke-width="2.5" fill="none"/>
    <rect x="80" y="380" width="160" height="50" rx="6" fill="#20242B" stroke="#282C33"/>
